name: Aplicar fondo biohacking

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-biohacking.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cambiar fondo a estilo biohacking
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('content="2026-09-16-descripciones-completas-10"','content="2026-09-16-biohacking-11"')
          s = s.replace('body{margin:0;background:#000;color:#fff;font-family:Inter,Arial,sans-serif}', "body{margin:0;color:#fff;font-family:Inter,Arial,sans-serif;background:radial-gradient(circle at 18% 16%,rgba(0,255,170,.10),transparent 24%),radial-gradient(circle at 82% 28%,rgba(0,190,255,.10),transparent 28%),radial-gradient(circle at 50% 82%,rgba(0,255,145,.06),transparent 30%),linear-gradient(135deg,#000 0%,#04090b 46%,#000 100%);background-attachment:fixed;position:relative;overflow-x:hidden}")
          s = s.replace('.wrap{width:min(1180px,calc(100% - 32px));margin:auto}', "body:before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.14;background-image:linear-gradient(rgba(0,255,180,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,180,.08) 1px,transparent 1px);background-size:58px 58px}body:after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.16;background:radial-gradient(circle at 30% 45%,rgba(0,255,170,.11),transparent 18%),radial-gradient(circle at 72% 62%,rgba(0,180,255,.10),transparent 20%);filter:blur(18px)}body>*{position:relative;z-index:1}.wrap{width:min(1180px,calc(100% - 32px));margin:auto}")
          s = s.replace('.hero{padding:90px 0 60px;background:radial-gradient(circle at 70% 25%,#171717,transparent 28%),linear-gradient(145deg,#000,#050505)}', ".hero{padding:90px 0 60px;background:radial-gradient(circle at 72% 24%,rgba(0,255,170,.13),transparent 24%),radial-gradient(circle at 18% 74%,rgba(0,170,255,.10),transparent 28%),linear-gradient(145deg,rgba(0,0,0,.94),rgba(4,11,13,.96))}")
          s = s.replace('.card{border:1px solid #222;background:linear-gradient(#0b0b0b,#050505);', '.card{border:1px solid rgba(0,255,170,.18);background:linear-gradient(180deg,rgba(8,13,15,.94),rgba(3,6,7,.97));box-shadow:0 0 24px rgba(0,255,170,.04);')
          s = s.replace('.panel{border:1px solid #222;padding:24px;background:#080808}', '.panel{border:1px solid rgba(0,255,170,.18);padding:24px;background:rgba(5,10,12,.94);box-shadow:0 0 24px rgba(0,255,170,.04)}')
          s = s.replace('.feature{border:1px solid #222;padding:18px}', '.feature{border:1px solid rgba(0,255,170,.16);padding:18px;background:rgba(3,8,10,.70)}')
          s = s.replace('.btn{border:1px solid #fff;background:#fff;color:#000;', '.btn{border:1px solid #00e6a2;background:#00e6a2;color:#00140d;box-shadow:0 0 14px rgba(0,230,162,.20);')
          s = s.replace('.btn.dark{background:#000;color:#fff}', '.btn.dark{background:rgba(0,0,0,.55);color:#00e6a2;border-color:#00e6a2}')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Guardar cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Aplicar fondo biohacking"
          git push
